[package]
name = "photovisor"
version = "0.1.2"
description = "PhotoVisor"
edition = "2024"

[lib]
name = "photovisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "exr", "hdr", "qoi", "tga", "pnm", "ico", "avif"] }
trash = { version = "5", default-features = false, features = ["coinit_multithreaded"] }
little_exif = "0.6"
percent-encoding = "2"
base64 = "0.22"
http = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
mozjpeg = "0.10"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
imageproc = "0.27"
rusqlite = { version = "0.43", features = ["bundled"] }
notify = "8"
kamadak-exif = "0.6"
fast_image_resize = { version = "6", features = ["image"] }
image_hasher = "3"
webp = { version = "0.3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
